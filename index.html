<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075985"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Halpa lataus</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body,#map{height:100%;margin:0}body{font-family:system-ui;background:#eef2f7}.bar{position:fixed;z-index:1000;top:0;left:0;right:0;background:#fff;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;box-shadow:0 2px 12px #0002}.row{display:flex;gap:7px;align-items:center}.title{font-weight:850;color:#075985;font-size:19px;margin-right:auto}input,button{height:38px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;padding:0 9px}input{width:90px}button{font-weight:750}.primary{background:#075985;color:#fff}.status{font-size:11px;color:#64748b;margin-top:5px}.bad{color:#b91c1c}.map{padding-top:92px;height:100%}.leaflet-popup-content{line-height:1.45}.price{font-size:18px;font-weight:850;color:#15803d}.route{display:inline-block;background:#075985;color:#fff!important;text-decoration:none;border-radius:8px;padding:7px 10px;margin-top:7px;font-weight:750}@media(max-width:620px){.bar{padding-left:7px;padding-right:7px}.row{gap:4px}.title{font-size:16px}input{width:73px;padding:0 6px}button{padding:0 7px}.status{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}</style></head><body><div class="bar"><div class="row"><div class="title">⚡ Halpa lataus</div><input id="price" type="number" value="0.35" min="0" step="0.01" aria-label="Enimmäishinta €/kWh"><input id="power" type="number" value="0" min="0" step="10" aria-label="Vähimmäisteho kW"><button id="gps">📍</button><button class="primary" id="refresh">↻</button></div><div class="status" id="status">Hinta ≤ 0,35 €/kWh · Teho ≥ 0 kW</div></div><div class="map"><div id="map"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const API='https://afir.digitraffic.fi/api/charging-network/v1',map=L.map('map',{preferCanvas:true}).setView([64.5,26],5),layer=L.layerGroup().addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap · Latausdata Fintraffic/Digitraffic CC BY 4.0'}).addTo(map);let loc=[],tar=new Map(),me;
const $=x=>document.getElementById(x),walk=(o,k,a=[])=>{if(!o||typeof o!=='object')return a;if(Array.isArray(o)){o.forEach(v=>walk(v,k,a));return a}for(const [q,v] of Object.entries(o)){if(q.toLowerCase()===k.toLowerCase())a.push(v);walk(v,k,a)}return a},arr=j=>Array.isArray(j)?j:(j.features||j.data||j.items||j.locations||j.tariffs||j.results||[]),eid=x=>x?.id??x?.properties?.id??x?.tariff_id??x?.tariffId;
async function all(kind){let r=await fetch(`${API}/${kind}?limit=ALL`);if(r.ok)return arr(await r.json());r=await fetch(`${API}/${kind}`);if(!r.ok)throw Error(`HTTP ${r.status}`);return arr(await r.json())}
function tids(x){return[...walk(x,'tariff_ids'),...walk(x,'tariffIds'),...walk(x,'tariff_id'),...walk(x,'tariffId')].flat(Infinity).filter(v=>['string','number'].includes(typeof v)).map(String)}
function tprice(t){let p=[...walk(t,'price_components'),...walk(t,'priceComponents')].flat(Infinity).filter(v=>v&&typeof v==='object').filter(v=>String(v.type??v.component_type??'').toUpperCase().includes('ENERGY')).map(v=>Number(v.price??v.amount)).filter(Number.isFinite);return p.length?Math.min(...p):null}
function power(x){let v=[...walk(x,'max_electric_power'),...walk(x,'maxElectricPower'),...walk(x,'max_power')].flat(Infinity).map(Number).filter(Number.isFinite);if(!v.length)return null;let m=Math.max(...v);return m>1000?m/1000:m}
function color(p){return p==null?'#64748b':p<=.30?'#15803d':p<=.40?'#ca8a04':p<=.50?'#ea580c':'#dc2626'} function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function draw(){layer.clearLayers();let n=0,max=+$('price').value,min=+$('power').value;for(const x of loc){let c=x.geometry?.coordinates;if(!Array.isArray(c))continue;let ids=tids(x),ps=ids.map(i=>tar.get(i)).filter(Boolean).map(tprice).filter(Number.isFinite),p=ps.length?Math.min(...ps):null,w=power(x);if(p==null||p>max||w!=null&&w<min||min>0&&w==null)continue;n++;let pr=x.properties||{},name=pr.name||pr.address?.name||'Latauspaikka',addr=[pr.address?.address,pr.address?.city].filter(Boolean).join(', ');L.circleMarker([c[1],c[0]],{radius:8,color:'#fff',weight:1.5,fillColor:color(p),fillOpacity:.92}).bindPopup(`<b>${esc(name)}</b><div class="price">${p.toFixed(2).replace('.',',')} €/kWh</div><div>⚡ ${w?Math.round(w)+' kW':'teho ei tiedossa'}</div>${addr?`<div>📍 ${esc(addr)}</div>`:''}<a class="route" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${c[1]},${c[0]}">Navigoi</a>`).addTo(layer)}$('status').textContent=`${n} paikkaa · hinta ≤ ${max.toFixed(2).replace('.',',')} €/kWh · teho ≥ ${min} kW`}
async function load(){try{$('status').textContent='Haetaan Fintrafficin tietoja…';[loc,ts]=await Promise.all([all('locations'),all('tariffs')]);tar=new Map(ts.map(t=>[String(eid(t)),t]));draw()}catch(e){$('status').innerHTML='<span class="bad">Datan haku epäonnistui: '+esc(e.message)+'</span>'}}$('price').oninput=draw;$('power').oninput=draw;$('refresh').onclick=load;$('gps').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{let c=[p.coords.latitude,p.coords.longitude];if(me)map.removeLayer(me);me=L.circleMarker(c,{radius:9,color:'#075985',weight:4,fillColor:'#38bdf8',fillOpacity:1}).addTo(map).bindPopup('Oma sijainti');map.setView(c,12)});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));load();
</script></body></html>

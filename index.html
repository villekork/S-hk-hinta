<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b5f45"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Halpa lataus</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--g:#0b5f45;--lime:#dff36a;--bg:#f4f7f5;--ink:#12231d;--line:#d9e3de}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}body{display:grid;grid-template-rows:auto 41vh 1fr;overflow:hidden}.top{background:#fff;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid var(--line);z-index:700}.r{display:flex;gap:7px;align-items:center}.brand{font-size:21px;font-weight:900;color:var(--g);flex:1}.btn{border:1px solid var(--line);background:#fff;height:39px;border-radius:10px;padding:0 11px;font-weight:800}.primary{background:var(--g);color:#fff;border-color:var(--g)}.search{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:7px}.search input{height:42px;border:1px solid var(--line);border-radius:10px;padding:0 11px;font-size:16px}#map{height:41vh}.sheet{background:#fff;min-height:0;overflow:auto;z-index:650;margin-top:-13px;border-radius:16px 16px 0 0;padding:9px 10px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -5px 18px #0001}.handle{width:42px;height:5px;background:#cad6d0;border-radius:5px;margin:0 auto 8px}.filters{display:flex;gap:6px;overflow:auto;padding-bottom:8px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-weight:800}.chip.on{background:var(--g);color:#fff;border-color:var(--g)}.summary{display:flex;justify-content:space-between;align-items:center;font-weight:900;margin:3px 2px 8px}.cards{display:grid;gap:8px}.card{border:1px solid var(--line);border-radius:13px;background:#fff;padding:10px}.topline{display:flex;gap:8px}.name{font-weight:900;flex:1}.price{font-size:20px;font-weight:950;color:var(--g)}.sub{font-size:12px;color:#62766c;margin-top:3px}.badges{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.badge{background:#edf3f0;border-radius:7px;padding:4px 7px;font-size:12px;font-weight:800}.free{background:#dcfce7;color:#166534}.busy{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:7px}.actions button{border:0;border-radius:9px;padding:8px 10px;font-weight:850}.nav{background:var(--g);color:#fff}.mapbtn{background:#e7efeb;color:var(--g)}.note{font-size:11px;color:#6e8177;padding:7px 2px}.leaflet-tooltip{padding:3px 6px;border:0;border-radius:8px;font-weight:900;color:#0b5f45;box-shadow:0 1px 7px #0003}.leaflet-tooltip:before{display:none}@media(min-width:850px){body{grid-template-columns:57% 43%;grid-template-rows:auto 1fr}.top{grid-column:1/-1}#map{height:100%}.sheet{height:100%;margin:0;border-radius:0}}
</style></head><body><header class="top"><div class="r"><div class="brand">⚡ Halpa lataus</div><button id="gps" class="btn">📍 Lähellä</button><button id="settings" class="btn">⚙️</button></div><div class="search"><input id="place" placeholder="Paikkakunta tai paikka"><button id="search" class="btn primary">Hae</button></div></header><div id="map"></div><section class="sheet"><div class="handle"></div><div class="filters" id="powers"><button class="chip on" data-p="0">Kaikki</button><button class="chip" data-p="22">22+ kW</button><button class="chip" data-p="50">50+ kW</button><button class="chip" data-p="150">150+ kW</button><button class="chip" data-p="300">300+ kW</button><button id="freeChip" class="chip">✓ Vapaa nyt</button><button id="priceChip" class="chip">≤ 0,40 €</button></div><div class="summary"><span>Edullisimmat ensin</span><span id="count">0 asemaa</span></div><div class="note" id="note">Hinta näytetään Fintrafficin tariffin ENERGY price -arvona sellaisenaan. ALV:tä ei lisätä sovelluksessa toista kertaa.</div><div id="cards" class="cards"></div></section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const API='https://afir.digitraffic.fi/api/charging-network/v1';const map=L.map('map',{preferCanvas:true}).setView([64.5,26],5),grp=L.layerGroup().addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap · Fintraffic/Digitraffic CC BY 4.0'}).addTo(map);let loc=[],tar=new Map(),sta=new Map(),minP=0,maxPrice=.40,freeOnly=false,user=null,me;const $=x=>document.getElementById(x);function arr(j){if(Array.isArray(j))return j;for(const k of['features','data','items','locations','tariffs','statuses'])if(Array.isArray(j?.[k]))return j[k];return[]}async function all(p){let r=await fetch(`${API}/${p}/all`);if(!r.ok)throw Error(`${p} ${r.status}`);return arr(await r.json())}function walk(o,k,a=[]){if(!o||typeof o!=='object')return a;if(Array.isArray(o)){o.forEach(v=>walk(v,k,a));return a}for(const[q,v]of Object.entries(o)){if(q.toLowerCase()===k.toLowerCase())a.push(v);walk(v,k,a)}return a}const ident=x=>x?.id??x?.properties?.id??x?.tariff_id??x?.tariffId??x?.location_id??x?.locationId;function tids(x){return[...walk(x,'tariff_ids'),...walk(x,'tariffIds'),...walk(x,'tariff_id'),...walk(x,'tariffId')].flat(Infinity).filter(v=>typeof v==='string'||typeof v==='number').map(String)}function pc(t){return[...walk(t,'price_components'),...walk(t,'priceComponents')].flat(Infinity).filter(x=>x&&typeof x==='object')}function price(t){let v=pc(t).filter(x=>String(x.type??x.component_type??'').toUpperCase().includes('ENERGY')).map(x=>{let p=Number(x.price??x.amount),vat=Number(x.vat);return Number.isFinite(p)?{gross:p,vat:Number.isFinite(vat)?vat:null}:null}).filter(Boolean);return v.sort((a,b)=>a.gross-b.gross)[0]||null}function coord(x){let c=x?.geometry?.coordinates;return Array.isArray(c)?[+c[1],+c[0]]:null}function pows(x){return[...new Set([...walk(x,'max_electric_power'),...walk(x,'maxElectricPower'),...walk(x,'max_power')].flat(Infinity).map(Number).filter(Number.isFinite).map(v=>Math.round(v>1000?v/1000:v)))].sort((a,b)=>a-b)}function scount(x){if(!x)return{f:null,t:null};let s=walk(x,'status').flat(Infinity).map(String).map(x=>x.toUpperCase());return{f:s.filter(x=>x==='AVAILABLE'||x==='FREE').length,t:s.length||null}}function info(x){let ps=pows(x),candidates=[];for(const tid of tids(x)){let t=tar.get(tid),pr=t&&price(t);if(pr)candidates.push(pr)}let pr=candidates.sort((a,b)=>a.gross-b.gross)[0]||null,st=sta.get(String(ident(x)));return{ps,max:ps.length?Math.max(...ps):0,pr,...scount(st)}}function nm(x){let p=x.properties||x;return p.name||p.address?.name||'Latausasema'}function ad(x){let a=(x.properties||x).address||{};return[a.address||a.street,a.city].filter(Boolean).join(', ')}function dist(c){if(!user)return null;let R=6371,a=(c[0]-user[0])*Math.PI/180,b=(c[1]-user[1])*Math.PI/180,q=Math.sin(a/2)**2+Math.cos(user[0]*Math.PI/180)*Math.cos(c[0]*Math.PI/180)*Math.sin(b/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function render(){grp.clearLayers();let rows=[];for(const x of loc){let c=coord(x),i=info(x);if(!c||!i.pr||i.pr.gross>maxPrice||i.max<minP||(freeOnly&&!(i.f>0)))continue;rows.push({x,c,i,d:dist(c)})}rows.sort((a,b)=>a.i.pr.gross-b.i.pr.gross||(a.d??99999)-(b.d??99999));$('count').textContent=`${rows.length} asemaa`;$('cards').innerHTML=rows.slice(0,60).map((r,n)=>card(r,n)).join('');rows.forEach((r,n)=>{let m=L.circleMarker(r.c,{radius:9,color:'#fff',weight:2,fillColor:r.i.pr.gross<=.30?'#16803d':r.i.pr.gross<=.40?'#d59d00':'#e45b22',fillOpacity:.96}).addTo(grp);m.bindTooltip(`${r.i.pr.gross.toFixed(2).replace('.',',')} €`,{permanent:map.getZoom()>9,direction:'top'});m.bindPopup(`<b>${esc(nm(r.x))}</b><br><b>${r.i.pr.gross.toFixed(2).replace('.',',')} €/kWh</b><br>⚡ ${r.i.ps.join(' / ')} kW<br>${r.i.f==null?'Saatavuus ei tiedossa':r.i.f+'/'+r.i.t+' vapaana'}<br>${esc(ad(r.x))}<br><button onclick=\"window.open('https://www.google.com/maps/dir/?api=1&destination=${r.c[0]},${r.c[1]}','_blank')\">Navigoi</button>`);m.on('click',()=>{m.openPopup();document.getElementById('c'+n)?.scrollIntoView({behavior:'smooth',block:'nearest'})})})}function card(r,n){let avail=r.i.f==null?'<span class="badge">Tila ei tiedossa</span>':r.i.f?`<span class="badge free">● ${r.i.f}/${r.i.t} vapaana</span>`:`<span class="badge busy">0/${r.i.t} vapaana</span>`;return `<article class="card" id="c${n}"><div class="topline"><div class="name">${esc(nm(r.x))}</div><div class="price">${r.i.pr.gross.toFixed(2).replace('.',',')} €/kWh</div></div><div class="sub">${esc(ad(r.x))}${r.d!=null?' · '+r.d.toFixed(1).replace('.',',')+' km':''}</div><div class="badges"><span class="badge">⚡ ${r.i.ps.join(' / ')} kW</span>${avail}<span class="badge">${r.i.pr.vat!=null?'ALV '+r.i.pr.vat+'% ilmoitettu':'Fintraffic-hinta'}</span></div><div class="actions"><button class="nav" onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${r.c[0]},${r.c[1]}','_blank')">Navigoi</button><button class="mapbtn" onclick="map.setView([${r.c[0]},${r.c[1]}],14)">Kartalle</button></div></article>`}async function load(){try{$('count').textContent='Päivitetään…';let[l,t,s]=await Promise.all([all('locations'),all('tariffs'),all('locations/statuses')]);loc=l;tar=new Map(t.map(x=>[String(ident(x)),x]));sta=new Map(s.map(x=>[String(ident(x)),x]));render()}catch(e){$('count').textContent='Datan haku epäonnistui';$('note').textContent=e.message}}$('powers').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.id==='freeChip'){freeOnly=!freeOnly;b.classList.toggle('on',freeOnly)}else if(b.id==='priceChip'){maxPrice=maxPrice===.40?.30:maxPrice===.30?.50:.40;b.textContent=`≤ ${maxPrice.toFixed(2).replace('.',',')} €`}else{document.querySelectorAll('#powers [data-p]').forEach(x=>x.classList.remove('on'));b.classList.add('on');minP=+b.dataset.p}render()};$('gps').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{user=[p.coords.latitude,p.coords.longitude];if(me)map.removeLayer(me);me=L.circleMarker(user,{radius:9,color:'#064e3b',weight:4,fillColor:'#dff36a',fillOpacity:1}).addTo(map);map.setView(user,11);render()});$('search').onclick=()=>{let q=$('place').value.trim();if(q)window.open('https://www.openstreetmap.org/search?query='+encodeURIComponent(q),'_blank')};$('settings').onclick=()=>alert('Suodattimet löytyvät kartan alta. Seuraavaan versioon voidaan lisätä operaattorit, maksukortti ja reittisuunnittelu.');if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));load();
</script></body></html>

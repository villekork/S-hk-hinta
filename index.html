<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#063b54"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Halpa lataus</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--navy:#063b54;--cyan:#0891b2;--green:#15803d;--bg:#eef4f7;--line:#ccd9df}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#102a36;background:var(--bg)}body{display:grid;grid-template-rows:auto 42vh 1fr;overflow:hidden}header{padding:calc(9px + env(safe-area-inset-top)) 12px 9px;background:var(--navy);color:#fff}.head{display:flex;align-items:center;gap:8px}.title{font-size:21px;font-weight:850;flex:1}.head button{height:38px;border:0;border-radius:10px;padding:0 12px;font-weight:800}.gps{background:#fff;color:var(--navy)}.refresh{background:#67e8f9;color:#083344}#map{height:42vh}.sheet{min-height:0;overflow:auto;padding:11px 12px calc(18px + env(safe-area-inset-bottom));background:#fff;border-radius:18px 18px 0 0;margin-top:-14px;z-index:500;box-shadow:0 -4px 18px #0002}.handle{width:42px;height:5px;border-radius:9px;background:#cbd5e1;margin:0 auto 9px}.summary{font-size:17px;font-weight:850;margin-bottom:9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:grid;gap:4px;font-size:12px;font-weight:750;color:#47606c}.field input,.field select{width:100%;height:44px;border:1px solid var(--line);border-radius:11px;background:#f8fafc;padding:0 10px;font-size:16px}.powers{display:flex;gap:6px;overflow:auto;padding:10px 0}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-weight:750}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}.status{font-size:12px;color:#64748b;margin:3px 0 9px}.cards{display:grid;gap:8px}.card{border:1px solid var(--line);border-radius:13px;padding:10px;background:#fff}.cardtop{display:flex;gap:8px;align-items:start}.name{font-weight:850;flex:1}.price{font-weight:900;color:var(--green);font-size:17px}.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.badge{font-size:12px;font-weight:750;padding:4px 7px;border-radius:7px;background:#e6f4f7}.free{background:#dcfce7;color:#166534}.none{background:#fee2e2;color:#991b1b}.unknown{background:#e2e8f0;color:#475569}.meta{font-size:12px;color:#64748b;margin-top:6px}.card button{margin-top:8px;border:0;background:var(--navy);color:#fff;padding:8px 11px;border-radius:9px;font-weight:800}.leaflet-popup-content{line-height:1.45}@media(min-width:800px){body{grid-template-columns:58% 42%;grid-template-rows:auto 1fr}header{grid-column:1/-1}#map{height:100%}.sheet{margin:0;border-radius:0;height:100%}}
</style></head><body><header><div class="head"><div class="title">⚡ Halpa lataus</div><button class="gps" id="gps">📍 Sijainti</button><button class="refresh" id="refresh">Päivitä</button></div></header><div id="map"></div><section class="sheet"><div class="handle"></div><div class="summary" id="summary">Haetaan latauspaikkoja…</div><div class="grid"><label class="field">Enimmäishinta, sis. ALV €/kWh<input id="price" type="number" value="0.40" min="0" step="0.01"></label><label class="field">Saatavuus<select id="availability"><option value="all">Kaikki</option><option value="free">Vähintään 1 vapaana</option></select></label></div><div class="powers" id="powerchips"><button class="chip on" data-power="0">Kaikki tehot</button><button class="chip" data-power="22">22+ kW</button><button class="chip" data-power="50">50+ kW</button><button class="chip" data-power="100">100+ kW</button><button class="chip" data-power="150">150+ kW</button><button class="chip" data-power="300">300+ kW</button></div><div class="status" id="status">Näytämme ALV:n sisältävän hinnan vain, jos tariffissa on ALV-prosentti. Puuttuvaa ALV-tietoa ei arvata.</div><div class="cards" id="cards"></div></section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const API='https://afir.digitraffic.fi/api/charging-network/v1',map=L.map('map',{preferCanvas:true}).setView([64.5,26],5),markers=L.layerGroup().addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap · Fintraffic/Digitraffic CC BY 4.0'}).addTo(map);let LOC=[],TAR=new Map(),STA=new Map(),minPower=0,userPos,userMarker;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function data(j){if(Array.isArray(j))return j;for(const k of ['features','data','items','locations','tariffs','statuses'])if(Array.isArray(j?.[k]))return j[k];return []}async function all(path){let r=await fetch(`${API}/${path}/all`);if(!r.ok)throw Error(`${path}: HTTP ${r.status}`);return data(await r.json())}function walk(o,n,a=[]){if(!o||typeof o!=='object')return a;if(Array.isArray(o)){o.forEach(v=>walk(v,n,a));return a}for(const[k,v]of Object.entries(o)){if(k.toLowerCase()===n.toLowerCase())a.push(v);walk(v,n,a)}return a}function id(x){return x?.id??x?.properties?.id??x?.tariff_id??x?.tariffId??x?.location_id??x?.locationId}function tariffIds(x){return [...walk(x,'tariff_ids'),...walk(x,'tariffIds'),...walk(x,'tariff_id'),...walk(x,'tariffId')].flat(Infinity).filter(v=>typeof v==='string'||typeof v==='number').map(String)}
function energyInclVat(t){const pcs=[...walk(t,'price_components'),...walk(t,'priceComponents')].flat(Infinity).filter(x=>x&&typeof x==='object');const vals=[];for(const p of pcs){if(!String(p.type??p.component_type??'').toUpperCase().includes('ENERGY'))continue;const raw=Number(p.price??p.amount),vat=Number(p.vat??p.vat_percentage??p.vatPercentage);if(Number.isFinite(raw)&&Number.isFinite(vat))vals.push({price:raw*(1+vat/100),vat})}return vals.length?vals.sort((a,b)=>a.price-b.price)[0]:null}
function coord(x){const c=x?.geometry?.coordinates??x?.properties?.geometry?.coordinates;return Array.isArray(c)?[+c[1],+c[0]]:null}function powers(x){return [...new Set([...walk(x,'max_electric_power'),...walk(x,'maxElectricPower'),...walk(x,'max_power')].flat(Infinity).map(Number).filter(Number.isFinite).map(v=>Math.round(v>1000?v/1000:v)))].sort((a,b)=>a-b)}function statusKey(x){return String(x?.location_id??x?.locationId??x?.id??x?.properties?.id??'')}function statusCounts(x){if(!x)return{free:null,total:null};const vals=[...walk(x,'status')].flat(Infinity).map(v=>String(v).toUpperCase());return{free:vals.filter(v=>['AVAILABLE','FREE'].includes(v)).length,total:vals.length||null}}
function info(x){const ids=tariffIds(x),prices=ids.map(i=>TAR.get(i)).filter(Boolean).map(energyInclVat).filter(Boolean),pr=prices.sort((a,b)=>a.price-b.price)[0]??null,ps=powers(x),key=String(id(x)??x?.properties?.id??''),sc=statusCounts(STA.get(key));return{pr,ps,max:ps.length?Math.max(...ps):null,...sc}}
function name(x){const p=x.properties??x;return p.name??p.address?.name??'Latauspaikka'}function addr(x){const a=(x.properties??x).address??{};return[a.address??a.street,a.city].filter(Boolean).join(', ')}function distance(c){if(!userPos)return null;const R=6371,dLat=(c[0]-userPos[0])*Math.PI/180,dLon=(c[1]-userPos[1])*Math.PI/180,a=Math.sin(dLat/2)**2+Math.cos(userPos[0]*Math.PI/180)*Math.cos(c[0]*Math.PI/180)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(a))}
function color(p){return p<=.30?'#15803d':p<=.40?'#ca8a04':p<=.50?'#ea580c':'#dc2626'}function render(){markers.clearLayers();const max=+$('price').value,freeOnly=$('availability').value==='free',rows=[];for(const x of LOC){const c=coord(x),i=info(x);if(!c||!i.pr||i.pr.price>max||i.max<minPower||freeOnly&&!(i.free>0))continue;rows.push({x,c,i,d:distance(c)})}rows.sort((a,b)=>(a.d??99999)-(b.d??99999)||a.i.pr.price-b.i.pr.price);$('summary').textContent=`${rows.length} sopivaa latauspaikkaa`;$('cards').innerHTML=rows.slice(0,40).map((r,n)=>card(r,n)).join('');for(const [n,r] of rows.entries()){const m=L.circleMarker(r.c,{radius:8,color:'#fff',weight:2,fillColor:color(r.i.pr.price),fillOpacity:.95}).addTo(markers);m.bindPopup(`<b>${esc(name(r.x))}</b><br>${r.i.pr.price.toFixed(2).replace('.',',')} €/kWh sis. ALV ${r.i.pr.vat}%<br>${r.i.free==null?'Vapaat eivät tiedossa':`${r.i.free}/${r.i.total} vapaana`}<br>Tehot: ${r.i.ps.join(', ')} kW`);m.on('click',()=>document.getElementById('c'+n)?.scrollIntoView({behavior:'smooth'}))}}
function card(r,n){const p=r.i.pr.price.toFixed(2).replace('.',','),avail=r.i.free==null?'<span class="badge unknown">Vapaat eivät tiedossa</span>':r.i.free>0?`<span class="badge free">${r.i.free}/${r.i.total} vapaana</span>`:`<span class="badge none">0/${r.i.total} vapaana</span>`,dist=r.d==null?'':` · ${r.d.toFixed(1).replace('.',',')} km`;return `<article class="card" id="c${n}"><div class="cardtop"><div class="name">${esc(name(r.x))}</div><div class="price">${p} €</div></div><div class="badges"><span class="badge">⚡ ${r.i.ps.join(' / ')} kW</span>${avail}<span class="badge">ALV ${r.i.pr.vat}% mukana</span></div><div class="meta">${esc(addr(r.x))}${dist}</div><button onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${r.c[0]},${r.c[1]}','_blank')">Navigoi</button></article>`}
async function load(){try{$('summary').textContent='Päivitetään sijainnit, hinnat ja vapaat laturit…';const[l,t,s]=await Promise.all([all('locations'),all('tariffs'),all('locations/statuses')]);LOC=l;TAR=new Map(t.map(x=>[String(id(x)),x]));STA=new Map(s.map(x=>[statusKey(x),x]));$('status').textContent=`Päivitetty ${new Date().toLocaleTimeString('fi-FI',{hour:'2-digit',minute:'2-digit'})}. Hinnat lasketaan tariffin price × (1 + ALV/100). Tariffit ilman ALV-tietoa jätetään pois.`;render()}catch(e){$('summary').textContent='Tietojen lataus epäonnistui';$('status').textContent=e.message}}
$('price').oninput=render;$('availability').onchange=render;$('powerchips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');minPower=+b.dataset.power;render()};$('refresh').onclick=load;$('gps').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{userPos=[p.coords.latitude,p.coords.longitude];if(userMarker)map.removeLayer(userMarker);userMarker=L.circleMarker(userPos,{radius:9,color:'#063b54',weight:4,fillColor:'#67e8f9',fillOpacity:1}).addTo(map);map.setView(userPos,11);render()},e=>alert('Sijaintia ei saatu: '+e.message),{enableHighAccuracy:true});if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));load();
</script></body></html>
